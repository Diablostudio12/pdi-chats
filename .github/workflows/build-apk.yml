name: Build APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build APK
        working-directory: app
        run: |
          flutter create --platforms=android --org com.pdi --project-name pdi_chats .
          bash ../tool/patch_android.sh
          flutter pub get
          flutter build apk --release
      - name: Publish release
        run: |
          gh release delete pdi-chats-latest --cleanup-tag -y || true
          gh release create pdi-chats-latest app/build/app/outputs/flutter-apk/app-release.apk --title "PDI CHATS" --notes "Latest build"
